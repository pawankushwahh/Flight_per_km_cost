<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price Predictor | Flight Cost Intelligence</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="icon" href="https://img.icons8.com/fluency/48/airplane-mode-on.png" type="image/png">
</head>
<body>
<nav class="navbar">
  <div class="container navbar-inner">
    <a href="index.html" class="navbar-brand"><div class="brand-icon"><i class="fas fa-plane"></i></div>Flight Cost Intelligence</a>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li><li><a href="compare.html">Compare</a></li>
      <li><a href="route-finder.html">Route Finder</a></li><li><a href="predictor.html" class="active">Predictor</a></li>
      <li><a href="optimizer.html">Optimizer</a></li><li><a href="heatmap.html">Heatmap</a></li><li><a href="visualizations.html">Visualizations</a></li><li><a href="faq.html">FAQ</a></li>
    </ul>
    <div class="nav-toggle" id="navToggle"><span></span><span></span><span></span></div>
  </div>
</nav>
<section class="hero hero-sub" data-hero="predictor">
  <div class="hero-bg">
    <img src="assets/images/sub-hero-predictor.jpg" alt="Analytics dashboard with price trend charts">
  </div>
  <div class="hero-overlay"></div>
  <div class="container text-center">
    <h1>Price Trend Predictor</h1>
    <p>Discover the cheapest months to fly and the best time to book any Indian route.</p>
  </div>
</section>
<section class="section">
  <div class="container">
    <div class="card mb-3">
      <div class="card-body">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">From</label>
            <div class="select-wrapper">
              <select id="origin" class="form-control"><option value="">Loading…</option></select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">To</label>
            <div class="select-wrapper">
              <select id="destination" class="form-control"><option value="">Loading…</option></select>
            </div>
          </div>
          <div class="form-group" style="align-self:flex-end;">
            <button id="predict-btn" class="btn btn-primary btn-block"><i class="fas fa-chart-line"></i> Predict Prices</button>
          </div>
        </div>
      </div>
    </div>
    <div id="results" style="display:none;"></div>
  </div>
</section>
<footer class="footer"><div class="container"><div class="footer-bottom" style="border:none;padding:0;"><p>&copy; 2025 Flight Cost Intelligence. <a href="index.html" style="color:rgba(255,255,255,0.5);">Home</a></p></div></div></footer>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/images.js"></script>
<script src="assets/js/common.js"></script>
<script>
let monthChart = null;

(async () => {
  const airports = await fetchAirports();
  fillSelect(document.getElementById('origin'),      airports, 'Select origin');
  fillSelect(document.getElementById('destination'), airports, 'Select destination');
  const p = new URLSearchParams(window.location.search);
  if (p.get('origin'))      document.getElementById('origin').value      = p.get('origin');
  if (p.get('destination')) document.getElementById('destination').value = p.get('destination');
  if (p.get('origin') && p.get('destination')) setTimeout(() => document.getElementById('predict-btn').click(), 300);
})();

document.getElementById('predict-btn').addEventListener('click', async () => {
  const origin = document.getElementById('origin').value;
  const dest   = document.getElementById('destination').value;
  if (!origin || !dest) { alert('Please select both airports.'); return; }

  const res = document.getElementById('results');
  res.style.display = 'block';
  res.innerHTML = `<div class="spinner-wrap"><div class="spinner"></div><span>Analysing price trends…</span></div>`;

  try {
    const d = await apiCall(CONFIG.ENDPOINTS.PREDICT, { origin, destination: dest });
    if (!d.success) throw new Error(d.error || 'No trend data available for this route.');
    renderPrediction(d.data, origin, dest);
    res.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    res.innerHTML = `<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> ${e.message}</div>`;
  }
});

function renderPrediction(data, origin, dest) {
  const res        = document.getElementById('results');
  // FIX: savings is now clamped ≥ 0 by the backend, but clamp again on frontend too
  const savings    = Math.max(0, data.savings_percentage || 0);
  const confidence = data.price_confidence;
  const confColor  = confidence === 'High' ? 'badge-green' : confidence === 'Medium' ? 'badge-amber' : 'badge-red';
  const currentMonth = data.current_month || 'Current';

  // Savings label — only shown when there is actually a saving to be had
  const savingsHtml = savings > 0
    ? `<div class="p-label">Potential Savings</div><div class="p-value" style="color:var(--sky);">${savings.toFixed(1)}%</div><div class="p-sub">vs. current month</div>`
    : `<div class="p-label">Savings</div><div class="p-value" style="font-size:1rem;color:var(--green);">Already at a good price</div><div class="p-sub">${currentMonth} is near the lowest</div>`;

  res.innerHTML = `
    <div class="card mb-3">
      <div class="card-header">
        <h3><i class="fas fa-chart-line" style="color:var(--amber);margin-right:8px;"></i>${origin} → ${dest} — ${currentMonth} Analysis</h3>
        <span class="badge ${confColor}">${confidence} Confidence</span>
      </div>
      <div class="card-body">
        <div class="prediction-grid">
          <div class="prediction-item"><div class="p-label">${currentMonth} Price</div><div class="p-value">${fmtPrice(data.current_price)}</div></div>
          <div class="prediction-item"><div class="p-label">Lowest (year)</div><div class="p-value" style="color:var(--green);">${fmtPrice(data.lowest_price)}</div></div>
          <div class="prediction-item"><div class="p-label">Highest (year)</div><div class="p-value" style="color:var(--red);">${fmtPrice(data.highest_price)}</div></div>
          <div class="prediction-item">${savingsHtml}</div>
        </div>
        ${data.best_time_to_book ? `<div class="alert alert-info mt-2"><i class="fas fa-lightbulb"></i> <b>Tip:</b> ${data.best_time_to_book}</div>` : ''}
      </div>
    </div>
    <div class="card mb-3">
      <div class="card-header"><h3>Monthly Price Chart</h3></div>
      <div class="card-body"><div class="chart-wrap"><canvas id="month-chart"></canvas></div></div>
    </div>
    <div class="card">
      <div class="card-header"><h3>Monthly Prices</h3></div>
      <div class="card-body"><div class="months-grid" id="months-grid"></div></div>
    </div>`;

  if (data.monthly_prices && data.monthly_prices.length) {
    const prices = data.monthly_prices;
    const minP   = Math.min(...prices.map(m => m.avg_price));
    document.getElementById('months-grid').innerHTML = prices.map(m => `
      <div class="month-card ${m.avg_price === minP ? 'best' : ''}">
        <div class="month-name">${m.month.slice(0,3)}</div>
        <div class="month-price">${fmtPrice(m.avg_price)}</div>
        ${m.avg_price === minP ? '<div style="font-size:0.7rem;color:var(--sky);font-weight:700;margin-top:3px;">Best</div>' : ''}
        ${m.month === (data.current_month || '') ? '<div style="font-size:0.7rem;color:var(--amber);font-weight:700;margin-top:1px;">Now</div>' : ''}
      </div>`).join('');

    if (monthChart) monthChart.destroy();
    monthChart = new Chart(document.getElementById('month-chart').getContext('2d'), {
      type: 'line',
      data: {
        labels: prices.map(m => m.month.slice(0,3)),
        datasets: [{
          label: 'Avg Price',
          data:  prices.map(m => m.avg_price),
          fill: true,
          borderColor: '#1B6FEB',
          backgroundColor: 'rgba(27,111,235,0.08)',
          pointBackgroundColor: prices.map(m => {
            if (m.avg_price === minP)                          return '#10B981'; // cheapest = green
            if (m.month === (data.current_month || ''))        return '#F59E0B'; // current  = amber
            return '#1B6FEB';
          }),
          pointRadius: prices.map(m => m.avg_price === minP || m.month === (data.current_month || '') ? 7 : 4),
          tension: 0.35, borderWidth: 2.5,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: c => fmtPrice(c.parsed.y) } }
        },
        scales: { y: { beginAtZero: false, ticks: { callback: v => '₹' + v.toLocaleString('en-IN') } } }
      }
    });
  }
}
</script>
</body>
</html>
